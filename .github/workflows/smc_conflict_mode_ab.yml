name: SMC Conflict Mode A/B

on:
  workflow_dispatch:
    inputs:
      universe:
        description: "Universe for the A/B run"
        required: true
        default: "all_nse"
        type: choice
        options:
          - nifty500
          - all_nse
      symbols:
        description: "Maximum symbols; 0 = all symbols in selected universe"
        required: true
        default: "0"
        type: string
      hold_days:
        description: "Maximum holding period"
        required: true
        default: "20"
        type: string
      workers:
        description: "Backtest workers"
        required: true
        default: "8"
        type: string
      source:
        description: "Price data source"
        required: true
        default: "yfinance"
        type: choice
        options:
          - yfinance
          - upstox
      shadow:
        description: "Compare admitted shadow subset"
        required: true
        default: false
        type: boolean

jobs:
  smc-conflict-ab:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run SMC conflict A/B
        run: |
          mkdir -p ab_out
          python scripts/smc_conflict_mode_ab.py             --universe "${{ inputs.universe }}"             --symbols "${{ inputs.symbols }}"             --hold-days "${{ inputs.hold_days }}"             --workers "${{ inputs.workers }}"             --source "${{ inputs.source }}"             --out ab_out             ${{ inputs.shadow && '--shadow' || '' }}

      - name: Upload A/B artifacts
        uses: actions/upload-artifact@v4
        with:
          name: smc-conflict-ab-${{ inputs.universe }}
          path: ab_out/
          if-no-files-found: error
          retention-days: 14

      - name: Job summary
        if: always()
        run: |
          if [ -f ab_out/report.txt ]; then
            cat ab_out/report.txt >> "$GITHUB_STEP_SUMMARY"
          fi
