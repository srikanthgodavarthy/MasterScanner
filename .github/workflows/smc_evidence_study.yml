name: SMC Evidence Study

on:
  workflow_dispatch:
    inputs:
      universe:
        description: "Universe"
        required: true
        default: "all_nse"
        type: choice
        options:
          - nifty500
          - all_nse
      symbols:
        description: "Maximum symbols; 0 = all symbols in selected universe"
        required: true
        default: "0"
        type: string
      years:
        description: "Years of history"
        required: true
        default: "3"
        type: string
      win:
        description: "Recency window (bars) for the evidence flags"
        required: true
        default: "10"
        type: string
      source:
        description: "Price data source"
        required: true
        default: "yfinance"
        type: choice
        options:
          - yfinance
          - upstox

jobs:
  smc-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run SMC evidence study
        run: |
          mkdir -p ev_out
          python scripts/smc_evidence_study.py --universe "${{ inputs.universe }}" --symbols "${{ inputs.symbols }}" --years "${{ inputs.years }}" --win "${{ inputs.win }}" --source "${{ inputs.source }}" --out ev_out

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: smc-evidence-${{ inputs.universe }}
          path: ev_out/
          if-no-files-found: error
          retention-days: 14

      - name: Job summary
        if: always()
        run: |
          if [ -f ev_out/report.txt ]; then
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            cat ev_out/report.txt >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi
